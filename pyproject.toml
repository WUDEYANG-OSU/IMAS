[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imas-multiomics"
version = "0.3.0"
description = "Integrative Multi-omic Augmentation System for tumour single-cell multiomics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "IMAS Development Team"}]
keywords = ["single-cell", "multiomics", "RNA", "ATAC", "tumour", "perturbation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "torch>=2.1",
  "matplotlib>=3.7,<4",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
full = [
  "anndata>=0.10,<1",
  "scanpy>=1.10,<2",
  "networkx>=3.1,<4",
  "umap-learn>=0.5.5,<1",
  "gseapy>=1.1,<2",
  "python-igraph>=0.11,<1",
  "leidenalg>=0.10,<1",
  "threadpoolctl>=3.2,<4",
  "requests>=2.31,<3",
  "xlsxwriter>=3.1,<4",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "build>=1.2,<2",
]

[project.urls]
Repository = "https://github.com/ORG/IMAS"
Issues = "https://github.com/ORG/IMAS/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["reproduction"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
