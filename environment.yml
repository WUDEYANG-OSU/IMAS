name: imas
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24
  - numpy>=1.24,<3
  - pandas>=2.0,<3
  - scipy>=1.10,<2
  - scikit-learn>=1.3,<2
  - matplotlib>=3.7,<4
  - pyyaml>=6
  - anndata>=0.10,<1
  - scanpy>=1.10,<2
  - networkx>=3.1,<4
  - umap-learn>=0.5.5,<1
  - python-igraph>=0.11,<1
  - leidenalg>=0.10,<1
  - requests>=2.31,<3
  - xlsxwriter>=3.1,<4
  # Select CUDA packages that match the target machine. Remove these entries for CPU-only use.
  - pytorch>=2.1
  - pytorch-cuda=12.1
  - pip:
      - gseapy>=1.1,<2
      - threadpoolctl>=3.2,<4
      - pytest>=8,<9
